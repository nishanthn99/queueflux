spring:
  application:
    name: queueflux-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queueflux}
    username: ${DB_USERNAME:queueflux}
    password: ${DB_PASSWORD:queueflux-dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  retention:
    run-ttl-days: ${APP_RETENTION_RUN_TTL_DAYS:30}
    cleanup-cron: ${APP_RETENTION_CLEANUP_CRON:0 0 2 * * *}
