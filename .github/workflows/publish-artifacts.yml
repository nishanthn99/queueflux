name: Publish Maven artifacts

on:
  pull_request:
    branches: [main, deploy]
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Maven release version (without the leading v)
        required: true
        type: string
      registry:
        description: Where to publish the Maven artifacts
        required: true
        default: github
        type: choice
        options:
          - github
          - jfrog

permissions:
  contents: read

concurrency:
  group: publish-maven-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  validate-publishing-config:
    name: Validate Maven publishing configuration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate parent Maven version and POM syntax
        run: |
          mvn -B -ntp -N validate
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=ns)
          if not version:
              version = root.findtext("m:parent/m:version", namespaces=ns)
          if not version or not re.fullmatch(r"\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Parent POM version is not semantic: {version!r}")
          print(f"Validated release version: {version}")
          PY
      - name: Report publishing workflow validation
        run: echo "Maven POM syntax and canonical release version validated. No publishing credentials or registry writes were used."

  publish:
    name: Publish Maven modules
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_REGISTRY: ${{ github.event_name == 'workflow_dispatch' && inputs.registry || vars.MAVEN_REGISTRY || 'github' }}
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
      JFROG_MAVEN_REPO_URL: ${{ vars.JFROG_MAVEN_REPO_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
      JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate release inputs
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Expected a semantic version such as 0.1.0"; exit 1; }
          [[ "$MAVEN_REGISTRY" == "github" || "$MAVEN_REGISTRY" == "jfrog" ]] || { echo "MAVEN_REGISTRY must be github or jfrog"; exit 1; }
          if [[ "$MAVEN_REGISTRY" == "jfrog" ]]; then
            test -n "$JFROG_MAVEN_REPO_URL" || { echo "Set JFROG_MAVEN_REPO_URL repository variable"; exit 1; }
            test -n "$JFROG_USERNAME" || { echo "Set JFROG_USERNAME secret"; exit 1; }
            test -n "$JFROG_PASSWORD" || { echo "Set JFROG_PASSWORD secret"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Configure GitHub Packages authentication
        if: env.MAVEN_REGISTRY == 'github'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven
      - name: Configure JFrog Artifactory authentication
        if: env.MAVEN_REGISTRY == 'jfrog'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          server-id: jfrog
          server-username: JFROG_USERNAME
          server-password: JFROG_PASSWORD
          cache: maven
      - name: Set release version across the Maven reactor
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
      - name: Verify and publish to GitHub Packages
        if: env.MAVEN_REGISTRY == 'github'
        run: |
          mvn -B -ntp deploy -DskipTests
      - name: Verify and publish to JFrog Artifactory
        if: env.MAVEN_REGISTRY == 'jfrog'
        run: |
          mvn -B -ntp deploy -DskipTests "-DaltDeploymentRepository=jfrog::${JFROG_MAVEN_REPO_URL}"
