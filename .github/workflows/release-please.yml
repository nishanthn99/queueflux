name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    name: Build and attach release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate release version
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected release tag: ${TAG}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and test backend
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "backend/server/target/server-${VERSION}.jar" "release-assets/queueflux-api-${VERSION}.jar"
          zip -j "release-assets/queueflux-maven-modules-${VERSION}.zip" backend/*/target/*.jar
          zip -r "release-assets/queueflux-web-${VERSION}.zip" web/dist

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${TAG}" release-assets/* --clobber
          if [[ "${VERSION}" == 0.* ]]; then
            gh release edit "${TAG}" --prerelease
          fi
