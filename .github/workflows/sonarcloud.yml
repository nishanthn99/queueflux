name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/continuous-testing-main-protection]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration-status:
    name: SonarQube configuration status
    runs-on: ubuntu-latest
    steps:
      - name: Report SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
        run: |
          if [[ "$SONAR_ENABLED" == "true" && -n "$SONAR_TOKEN" && -n "$SONAR_ORGANIZATION" && -n "$SONAR_PROJECT_KEY" ]]; then
            echo "SonarQube Cloud is configured and enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## SonarQube Cloud analysis is not enabled"
              echo
              echo "Analysis is skipped until repository configuration is complete."
              echo
              echo "Set these in **Settings → Secrets and variables → Actions**:"
              echo "- Repository variable `SONAR_ENABLED` = `true`"
              echo "- Repository variable `SONAR_ORGANIZATION` = your SonarCloud organization key"
              echo "- Repository variable `SONAR_PROJECT_KEY` = project key"
              echo "- Repository secret `SONAR_TOKEN` = SonarCloud analysis token"
              echo
              echo "Rerun this workflow or push a commit after configuring."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::SonarCloud is skipped because repository configuration is incomplete."
          fi

  sonar-analysis:
    name: SonarQube Cloud analysis
    if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: configuration-status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate SonarQube configuration
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN secret is missing"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "SONAR_ORGANIZATION repository variable is missing"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY repository variable is missing"; exit 1; }
      - name: Generate frontend LCOV coverage
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run test:coverage
      - name: Build, test, collect JaCoCo and run SonarQube analysis
        run: |
          mvn -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
              "-Dsonar.organization=$SONAR_ORGANIZATION" \
              "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
              "-Dsonar.host.url=https://sonarcloud.io" \
              "-Dsonar.qualitygate.wait=true" \
              "-Dsonar.java.jdkHome=$JAVA_HOME" \
              "-Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml" \
              "-Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info"
