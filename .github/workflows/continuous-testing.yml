name: Continuous Testing

# CT is intentionally separate from PR CI: extended API regression tests only.
on:
  pull_request:
    branches: [main, deploy]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-integration:
    name: PostgreSQL-backed API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: queueflux
          POSTGRES_USER: queueflux
          POSTGRES_PASSWORD: queueflux-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueflux -d queueflux"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Package the application but skip CI-owned unit tests.
      - name: Package API without rerunning unit tests
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Start API against PostgreSQL
        env:
          DB_URL: jdbc:postgresql://localhost:5432/queueflux
          DB_USERNAME: queueflux
          DB_PASSWORD: queueflux-dev
          PORT: 8080
        run: |
          java -jar backend/server/target/server-*.jar > /tmp/queueflux-api.log 2>&1 &
          echo $! > /tmp/queueflux-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/queueflux-health.json; then
              cat /tmp/queueflux-health.json
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy. Startup logs:"
          cat /tmp/queueflux-api.log
          exit 1

      - name: Run extended API integration checks
        env:
          API_BASE_URL: http://localhost:8080
        run: node .github/scripts/continuous-testing-api.mjs

      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/queueflux-api.log

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/queueflux-api.pid ]; then
            kill "$(cat /tmp/queueflux-api.pid)" || true
          fi
