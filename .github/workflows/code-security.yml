name: Code Security

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main, deploy]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: code-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21 for Java analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Analyze with CodeQL
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          # Keep SARIF under GITHUB_WORKSPACE so it can be attached to fork PRs.
          output: codeql-sarif
          # Fork PRs have a read-only GITHUB_TOKEN. Run the scanner but do not
          # attempt Code Scanning or database uploads from an untrusted fork.
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'never' || 'always' }}
          upload-database: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'false' || 'true' }}
      - name: Explain fork PR CodeQL handling
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          {
            echo "## CodeQL analysis"
            echo
            echo "CodeQL analysis ran for this fork pull request. GitHub does not grant fork workflows permission to upload Code Scanning results, so the SARIF output is attached as a workflow artifact instead."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CodeQL SARIF for fork PR review
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && hashFiles('codeql-sarif/**/*.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}/
          if-no-files-found: error
          retention-days: 7

  semgrep:
    name: Semgrep Community SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0
      - name: Scan repository with Semgrep community rules
        run: |
          semgrep scan \
            --config auto \
            --error \
            --exclude '**/target/**' \
            --exclude 'web/node_modules/**' \
            --exclude 'web/coverage/**' \
            --sarif \
            --output semgrep.sarif
      - name: Print Semgrep finding details
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("semgrep.sarif").read_text(encoding="utf-8"))
          findings = []
          for run in report.get("runs", []):
              for result in run.get("results", []):
                  locations = result.get("locations", [])
                  physical = locations[0].get("physicalLocation", {}) if locations else {}
                  artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
                  region = physical.get("region", {})
                  line = region.get("startLine", "?")
                  rule_id = result.get("ruleId", "unknown-rule")
                  message = result.get("message", {}).get("text", "").replace("\n", " ")
                  findings.append((rule_id, artifact, line, message))

          summary = [f"Semgrep reported {len(findings)} finding(s)."]
          if findings:
              summary.append("")
              for rule_id, artifact, line, message in findings:
                  detail = f"- `{rule_id}` — `{artifact}:{line}` — {message}"
                  summary.append(detail)
                  print(detail)
          else:
              summary.append("")
              summary.append("No findings.")
              print("No Semgrep findings.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY
      - name: Upload Semgrep SARIF for fork PR review
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Upload Semgrep findings to GitHub code scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-community
