name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/continuous-testing-main-protection]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and JaCoCo coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend modules and generate JaCoCo XML
        run: mvn -B -ntp clean verify
      - name: Publish backend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jacoco-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend tests, lint, build and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests and collect V8 coverage
        run: npm run test:coverage
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Publish frontend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-lcov-coverage
          path: web/coverage/
          if-no-files-found: warn
          retention-days: 14
