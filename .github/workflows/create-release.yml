name: Create GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-from-parent-version
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish version from parent POM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Read and validate release version from parent POM
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          print(root.findtext("m:version", namespaces=ns).strip())
          PY
          )"
          if [[ -z "$VERSION" || "$VERSION" == *SNAPSHOT* ]]; then
            echo "Root pom.xml must declare a stable (non-SNAPSHOT) release version; found '$VERSION'."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$VERSION' is not a supported semantic version."
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION ($TAG)"

      - name: Skip if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; no duplicate will be created."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test backend
        if: steps.existing.outputs.exists != 'true'
        run: mvn -B -ntp clean verify

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        if: steps.existing.outputs.exists != 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "backend/server/target/server-$VERSION.jar" "release-assets/queueflux-api-$VERSION.jar"
          zip -j "release-assets/queueflux-maven-modules-$VERSION.zip" backend/*/target/*.jar
          zip -r "release-assets/queueflux-web-$VERSION.zip" web/dist

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          RELEASE_ARGS=(--title "QueueFlux $TAG" --generate-notes)
          if [[ "$VERSION" == 0.* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* "${RELEASE_ARGS[@]}"
